[package]
name = "a11ylens-desktop"
version = "0.1.0"
description = "A11yLens Desktop — доступность и безопасность сайта"
edition = "2021"
rust-version = "1.77"

# Только Windows-таргет (решение прогона: «без линукса»); сборка на других
# платформах не предусматривается — см. README.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
